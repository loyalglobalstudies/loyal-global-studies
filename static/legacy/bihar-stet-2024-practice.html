"], "a": 3, "e": "प्रतिरोधकता का SI मात्रक ओम-मीटर है।"}, {"q": "बैटरी से प्राप्त विद्युत धारा किस प्रकार की होती है?", "o": ["AC", "DC", "AC और DC", "कोई नहीं"], "a": 1, "e": "बैटरी दिष्ट धारा (DC) देती है।"}, {"q": "शुष्क सेल में ऋण इलेक्ट्रोड किसका बना होता है?", "o": ["तांबा", "कार्बन", "जस्ता", "इनमें से कोई नहीं"], "a": 2, "e": "शुष्क सेल का ऋण इलेक्ट्रोड जस्ते का होता है।"}, {"q": "डायनेमो में—", "o": ["यांत्रिक ऊर्जा विद्युत ऊर्जा में बदलती है", "विद्युत ऊर्जा यांत्रिक ऊर्जा में", "रासायनिक ऊर्जा विद्युत ऊर्जा में", "इनमें से कोई नहीं"], "a": 0, "e": "डायनेमो यांत्रिक ऊर्जा को विद्युत ऊर्जा में बदलता है।"}, {"q": "विद्युत चुंबक बनाने में प्रायः किस पदार्थ की छड़ का उपयोग होता है?", "o": ["इस्पात", "पीतल", "नरम लोहा", "इनमें से कोई नहीं"], "a": 2, "e": "नरम लोहा चुंबकीय गुण जल्दी ग्रहण और छोड़ता है।"}, {"q": "0 से 2 A के बीच 20 विभाग वाले मीटर का अल्पतमांक है—", "o": ["0.1 A", "0.01 A", "0.2 A", "0.02 A"], "a": 0, "e": "अल्पतमांक = 2 ÷ 20 = 0.1 A।"}, {"q": "परिपथ के दो बिंदुओं के बीच विभवांतर मापने के लिए प्रयुक्त यंत्र है—", "o": ["ऐमीटर", "वोल्टमीटर", "गैल्वेनोमीटर", "प्लग कुंजी"], "a": 1, "e": "विभवांतर वोल्टमीटर से मापा जाता है।"}, {"q": "अंतरिक्ष यात्री को आकाश कैसा प्रतीत होता है?", "o": ["काला", "नीला", "लाल", "इनमें से कोई नहीं"], "a": 0, "e": "अंतरिक्ष में वायुमंडल नहीं होने से प्रकाश बिखरता नहीं, अतः आकाश काला दिखता है।"}, {"q": "तेल लगा कागज होता है—", "o": ["पारदर्शक", "अपारदर्शक", "पारभासक", "इनमें से कोई नहीं"], "a": 0, "e": "तेल लगाने से कागज पारदर्शक हो जाता है।"}, {"q": "कौन-सा लेंस अपसारी लेंस भी कहलाता है?", "o": ["अवतल लेंस", "उत्तल लेंस", "अवतल एवं उत्तल दोनों", "इनमें से कोई नहीं"], "a": 0, "e": "अवतल लेंस प्रकाश किरणों को फैलाता है।"}, {"q": "प्रकाश के परावर्तन के कितने नियम हैं?", "o": ["1", "2", "3", "4"], "a": 1, "e": "परावर्तन के दो नियम होते हैं।"}, {"q": "लेंस की शक्ति की इकाई क्या है?", "o": ["डायोप्टर", "मीटर", "सेंटीमीटर", "किलोमीटर"], "a": 0, "e": "लेंस की शक्ति की इकाई डायोप्टर है।"}];
let index = 0;
let answers = Array(questions.length).fill(null);
let finished = false;
let remaining = questions.length * 60;

const $ = id => document.getElementById(id);
const safe = value => String(value).replace(/[&<>"']/g, c =>
 ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showQuestion(){
 if(finished) return;
 const q = questions[index];
 $('question').textContent = (index + 1) + '. ' + q.q;
 $('progress').textContent =
   'Question ' + (index + 1) + ' / ' + questions.length;
 $('bar').style.width = ((index + 1) / questions.length * 100) + '%';

 $('options').innerHTML = q.o.map((option, j) =>
  '<label class="opt"><input type="radio" name="answer" value="' + j +
  '"' + (answers[index] === j ? ' checked' : '') + '> <b>(' +
  String.fromCharCode(65+j) + ')</b> ' + safe(option) + '</label>'
 ).join('');

 $('previous').disabled = index === 0;
 $('next').disabled = index === questions.length - 1;
}

$('options').addEventListener('change', event => {
 if(finished || event.target.name !== 'answer') return;
 answers[index] = Number(event.target.value);
});

$('previous').onclick = () => {
 if(index > 0 && !finished){index--;showQuestion();}
};
$('next').onclick = () => {
 if(index < questions.length - 1 && !finished){index++;showQuestion();}
};
$('submit').onclick = () => {
 if(!finished && confirm('Test submit karna hai? Uske baad answers change nahi honge.')){
  finishTest();
 }
};

function finishTest(){
 if(finished) return;
 finished = true;
 clearInterval(clock);
 const score = questions.reduce((sum,q,i) =>
  sum + (answers[i] === q.a ? 1 : 0), 0);

 $('exam').classList.add('hidden');
 $('result').classList.remove('hidden');
 $('result').innerHTML =
  '<h2>Final Result</h2><h3 class="gold">Score: ' +
  score + ' / ' + questions.length + '</h3><p>Correct: ' +
  score + ' | Wrong: ' +
  answers.filter((a,i)=>a !== null && a !== questions[i].a).length +
  ' | Unattempted: ' + answers.filter(a=>a===null).length +
  '</p><h2>Solutions</h2>' +
  questions.map((q,i)=>{
   const ok = answers[i] === q.a;
   return '<div class="review ' + (ok?'correct':'wrong') +
    '"><b>Q' + (i+1) + '. ' + safe(q.q) + '</b><p>Your answer: ' +
    (answers[i]===null?'Not attempted':
     '('+String.fromCharCode(65+answers[i])+') '+safe(q.o[answers[i]])) +
    '</p><p>Correct answer: <b>(' +
    String.fromCharCode(65+q.a) + ') ' + safe(q.o[q.a]) +
    '</b></p><p class="' + (ok?'gold':'muted') + '">' +
    (ok?'CORRECT':'WRONG / UNATTEMPTED') +
    '</p><p><b>Explanation:</b> ' + safe(q.e) + '</p></div>';
  }).join('');
 window.scrollTo(0,0);
}

function tick(){
 const m = Math.floor(remaining/60);
 const s = remaining%60;
 $('timer').textContent = String(m).padStart(2,'0') + ':' +
  String(s).padStart(2,'0');
 if(remaining <= 0){finishTest();return;}
 remaining--;
}
showQuestion();
tick();
const clock = setInterval(tick,1000);
</script>
